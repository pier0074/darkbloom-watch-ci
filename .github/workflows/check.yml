# Runs darkbloom-watch hourly, so the check keeps happening while the Mac
# that owns it is closed.
#
# This repository is public for one reason: GitHub bills macOS runners at ten
# times the Linux rate, and standard runners are free for public
# repositories. It is a cron entry and nothing more — the watcher, and what a
# run actually does, live in the private repository this checks out.
name: check

on:
  schedule:
    # Three chances an hour, none at :00. GitHub treats schedules as best
    # effort and drops runs under load, worst at the top of the hour — here
    # it created 23 of ~91 hourly runs. The run itself exits at once if an
    # earlier one already checked in this hour.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: darkbloom-check    # two runs would share one baseline
  cancel-in-progress: false

permissions:
  contents: write           # only for the heartbeat below

jobs:
  check:
    runs-on: macos-latest
    env:
      # The log is written in local time and the daily record is filed by
      # local day; a runner on UTC would put two clocks in one history.
      TZ: Europe/Zurich

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.WATCH_REPO || 'pier0074/darkbloom-watch' }}
          # A deploy key: it reaches that repository and nothing else in the
          # account, and does not expire.
          ssh-key: ${{ secrets.WATCH_DEPLOY_KEY }}
          path: watch

      - name: Check
        env:
          NTFY_URL: ${{ secrets.NTFY_URL_DARKBLOOM }}
        run: watch/ci-run.sh

      - name: Say so if the run failed
        # A run that dies writes nothing to the log, so from the Mac a broken
        # schedule and a quiet market look identical.
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL_DARKBLOOM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_URL" ] || exit 0
          curl -fsS --max-time 10 -H 'Title: Darkbloom Watch: the run failed' \
            -H 'Priority: high' -H 'Tags: warning' \
            -d "The hourly run did not finish. Nothing was captured for this hour. $RUN_URL" \
            "$NTFY_URL" >/dev/null || true

      - name: Keep the schedule alive
        # GitHub switches off a public repository's cron after 60 days with no
        # activity here, and every real commit lands in the other repository.
        if: github.event_name == 'schedule'
        run: |
          # Once a day is plenty, but a single fixed hour could be one of the
          # dropped ones for weeks; any run between 04:00 and 07:59 UTC counts.
          case "$(date -u '+%H')" in 04|05|06|07) ;; *) exit 0 ;; esac
          git clone -q --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beat
          cd beat
          git config user.name  'darkbloom-watch-ci'
          git config user.email 'darkbloom-watch-ci@users.noreply.github.com'
          # The date alone, so the several runs in that window make one
          # commit a day rather than one each.
          date -u '+%Y-%m-%d' > last-run
          git add last-run
          git diff --cached --quiet || git commit -q -m 'Heartbeat'
          git push -q
