# Runs darkbloom-watch hourly, so the check keeps happening while the Mac
# that owns it is closed.
#
# This repository is public for one reason: GitHub bills macOS runners at ten
# times the Linux rate, and standard runners are free for public
# repositories. It holds no code — the watcher, and what a run actually does,
# live in the private repository this checks out.
name: check

on:
  # Started every hour by cron-job.org through GitHub's API. GitHub's own
  # schedule is not used: it dropped three runs in four, and a started run is
  # not dropped. Without a schedule there is also no 60-day inactivity rule,
  # so no heartbeat commit is needed to keep this repository awake.
  workflow_dispatch:
    inputs:
      source:
        description: 'cron for the hourly trigger; anything else always runs'
        required: false
        default: manual

concurrency:
  group: darkbloom-check    # two runs would share one baseline
  cancel-in-progress: false

permissions:
  contents: read            # this repository is only read; the other is reached by deploy key

jobs:
  check:
    runs-on: macos-latest
    env:
      # The log is written in local time and the daily record is filed by
      # local day; a runner on UTC would put two clocks in one history.
      TZ: Europe/Zurich

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.WATCH_REPO || 'pier0074/darkbloom-watch' }}
          # A deploy key: it reaches that repository and nothing else in the
          # account, and does not expire.
          ssh-key: ${{ secrets.WATCH_DEPLOY_KEY }}
          path: watch

      - name: Check
        env:
          NTFY_URL: ${{ secrets.NTFY_URL_DARKBLOOM }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL_DARKBLOOM }}
          RUN_SOURCE: ${{ inputs.source }}
        run: watch/ci-run.sh

      - name: Say so if the run failed
        # A run that dies writes nothing to the log, so from the Mac a broken
        # run and a quiet market look identical.
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL_DARKBLOOM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_URL" ] || exit 0
          curl -fsS --max-time 10 -H 'Title: Darkbloom Watch: the run failed' \
            -H 'Priority: high' -H 'Tags: warning' \
            -d "The hourly run did not finish. Nothing was captured for this hour. $RUN_URL" \
            "$NTFY_URL" >/dev/null || true
